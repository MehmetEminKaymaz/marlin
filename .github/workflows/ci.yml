# Derleyiciyi üç platformda derler, paketler ve test takımını PAKETTEN
# çalıştırır: paket derleme dizininden uzak bir yere açılır, derleyiciye
# kaynak/derleme yolları gömülmez (MARLIN_DEV_PATHS=OFF), Windows'ta conda
# dizinleri PATH'ten çıkarılır. Böylece paketteki bir eksik test hatası olur.
# Paket, çalışmanın çıktısı (artifact) olarak indirilebilir.
#
# LLVM/MLIR 19.1.7 her seferinde derlenmez: conda-forge'un hazır paketleri
# kullanılır (micromamba; indirilen paketler önbellekte kalır). ANTLR C++
# runtime'ı ise projeyle birlikte kaynaktan derlenir (MARLIN_ANTLR_FROM_SOURCE).
#
# Makinelerde ekran kartı yoktur. @GPU kodu yine GPU için derlenir; Linux'ta
# yazılımla çalışan Vulkan sürücüsü (Mesa lavapipe) kurulur ve Vulkan
# çekirdekleri gerçekten çalıştırılır. Diğer platformlarda program GPU
# bulamaz ve CPU kopyasına geçer (bkz. tests/run.sh). PostgreSQL sunucusu
# yalnızca Linux'ta açılabildiği için postgres testi diğerlerinde atlanır.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Aynı dala yeni bir push gelince eski çalışma iptal edilir.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-24.04
          - name: macOS (arm64)
            os: macos-14
          - name: Windows (x86_64)
            os: windows-2022

    defaults:
      run:
        shell: bash -el {0}   # micromamba ortamı her adımda etkin

    steps:
      - uses: actions/checkout@v4

      # ANTLR aracı (jar) en az Java 11 ister; Windows makinesinin varsayılanı 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: marlin
          create-args: >-
            mlir=19.1.7
            llvmdev=19.1.7
            zlib
            zstd
            libxml2
            libpq
            sqlite
            libcurl
            libvulkan-headers
            cmake
            ninja
          init-shell: bash
          cache-downloads: true
          cache-environment: true

      # Windows: MSVC ortamı (link.exe, sistem kütüphaneleri) ve clang-cl.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # Linux: CUDA derleme araçları (libdevice, ptxas). Makinede GPU yoktur;
      # ama @GPU kodu GPU için de derlenir ve program çalışırken CPU
      # kopyasına geçer: GPU'ya geri dönüş mekanizmasının kendisi sınanır.
      - name: CUDA derleme araçları
        if: runner.os == 'Linux'
        run: |
          # (Yereldekiyle aynı sürüm: libdevice'ı LLVM 19 okuyabilmeli.)
          micromamba install -y -n marlin -c conda-forge cuda-version=12.9 cuda-nvcc cuda-nvvm-tools || true
          libdevice=$(find "$CONDA_PREFIX" -name libdevice.10.bc 2>/dev/null | head -1)
          if [ -n "$libdevice" ]; then
            root=$(dirname "$(dirname "$(dirname "$libdevice")")")
            echo "CUDA_ROOT=$root" >> "$GITHUB_ENV"
            echo "libdevice: $libdevice (CUDA_ROOT=$root)"
          else
            echo "::notice::libdevice bulunamadi; @GPU kodu yalnizca CPU icin derlenecek"
          fi

      # macOS: Vulkan, Metal üzerinde MoltenVK ile. Pakete girer; derleyici
      # GPU kullanan programın yanına onu kopyalar.
      - name: Vulkan (MoltenVK)
        if: runner.os == 'macOS'
        run: micromamba install -y -n marlin -c conda-forge moltenvk

      - name: Derleme ayarları
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            prefix="$(cygpath -m "$CONDA_PREFIX")/Library"
            echo "MARLIN_CMAKE_EXTRA=-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl" >> "$GITHUB_ENV"
            echo "MARLIN_EXE=.exe" >> "$GITHUB_ENV"
          else
            prefix="$CONDA_PREFIX"
          fi
          echo "MARLIN_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Yapılandır
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$MARLIN_PREFIX/lib/cmake/llvm" \
            -DMLIR_DIR="$MARLIN_PREFIX/lib/cmake/mlir" \
            -DCMAKE_PREFIX_PATH="$MARLIN_PREFIX" \
            -DMARLIN_ANTLR_FROM_SOURCE=ON \
            -DMARLIN_DEV_PATHS=OFF \
            $MARLIN_CMAKE_EXTRA

      - name: Derle
        run: cmake --build build --parallel

      # Paket üretilir ve derleme dizininden bağımsız bir yere açılır; bundan
      # sonraki her adım o derleyiciyi kullanır.
      - name: Paketle
        run: |
          (cd build && cpack)
          pkg=$(ls build/marlin-*.tar.gz build/marlin-*.zip 2>/dev/null | head -1)
          echo "paket: $pkg ($(du -h "$pkg" | cut -f1))"
          mkdir -p "$RUNNER_TEMP/paket"
          (cd "$RUNNER_TEMP/paket" && cmake -E tar xf "$GITHUB_WORKSPACE/$pkg")
          root="$RUNNER_TEMP/paket/$(basename "${pkg%.tar.gz}" .zip)"
          [ "$RUNNER_OS" = Windows ] && root="$(cygpath -u "$root")"
          find "$root" -maxdepth 3 -not -path '*/std/*' | sort
          echo "MARLIN_PACKAGE=$pkg" >> "$GITHUB_ENV"
          echo "MARLIN_COMPILER=$root/bin/marlin_lang$MARLIN_EXE" >> "$GITHUB_ENV"
          "$root/bin/marlin_lang$MARLIN_EXE" --version

      - uses: actions/upload-artifact@v4
        with:
          name: marlin-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.MARLIN_PACKAGE }}
          if-no-files-found: error

      # Paketteki derleyici ve kütüphaneler derleme makinesindeki bir yola
      # (conda ortamı, derleme dizini) bağlı kalmamalı.
      - name: Paket bağımlılıkları
        run: bash tests/paket_denetle.sh "$(dirname "$(dirname "$MARLIN_COMPILER")")"

      # macOS'ta timeout komutu yok; testler takılan programı onunla durdurur.
      - name: coreutils (gtimeout)
        if: runner.os == 'macOS'
        run: brew install coreutils

      # Linux: Vulkan yükleyicisi + Mesa'nın yazılımla çalışan sürücüsü
      # (lavapipe). @GPU testlerinin "@vulkan" çalışmaları bununla gerçekten
      # Vulkan'da olur (MARLIN_TEST_VULKAN=1 bunu denetler).
      - name: Vulkan (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 mesa-vulkan-drivers

      # Vulkan gerçekten çalışıyor mu? Küçük bir @GPU program Vulkan'da
      # çalıştırılır. macOS'ta makinenin Metal aygıtı olup olmadığı belli
      # değildir: çalışıyorsa testler Vulkan kullanımını da denetler.
      - name: Vulkan yoklaması
        if: runner.os != 'Windows'
        run: |
          mkdir -p yoklama && cd yoklama
          cat > yoklama.marl <<'EOF'
          @GPU
          func ikiyle(int n) -> matrix<int, 1> {
              matrix<int, 1> m = zeros(n);
              parallel for i in 0 .. n {
                  m[i] = i * 2;
              }
              return m;
          }
          func main() -> void {
              print(sum(ikiyle(1000)));
          }
          EOF
          "$MARLIN_COMPILER" yoklama.marl -o yoklama
          ls -la
          MARLIN_GPU=vulkan MARLIN_GPU_REPORT=1 ./yoklama 2>&1 | tee cikti.txt
          if grep -q '^marlin gpu: vulkan' cikti.txt && grep -q '^999000$' cikti.txt; then
            echo "MARLIN_TEST_VULKAN=1" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = Linux ]; then
            echo "::error::lavapipe kurulu ama Vulkan calismadi"; exit 1
          else
            echo "::notice::Vulkan aygiti yok; @GPU testleri CPU'da calisacak"
            if [ "$RUNNER_OS" = macOS ]; then
              # (Bilgi için: sanal Metal aygıtı argüman tamponları olmadan çalışır mı?)
              MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS=0 MARLIN_GPU=vulkan MARLIN_GPU_REPORT=1 MVK_CONFIG_LOG_LEVEL=2 ./yoklama 2>&1 || true
            fi
          fi

      - name: PostgreSQL test sunucusu
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER marlin WITH PASSWORD 'marlin';"
          sudo -u postgres psql -c "CREATE DATABASE marlin_test OWNER marlin;"
          echo "MARLIN_PG_TEST=host=localhost port=5432 dbname=marlin_test user=marlin password=marlin" >> "$GITHUB_ENV"

      # Windows'ta DLL'ler PATH'te de aranır: conda ortamı PATH'te kalırsa
      # pakette eksik bir DLL fark edilmez.
      - name: Testler
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            PATH="$(echo "$PATH" | tr ':' '\n' | grep -vi micromamba | paste -sd:)"
          fi
          bash tests/run.sh "$MARLIN_COMPILER"

      # Testler kalırsa: küçük bir programı adım adım derleyip hangi aşamada
      # bozulduğunu gösterir.
      - name: Teşhis
        if: failure()
        run: |
          set +e   # bir adım kalsa da hepsini göster
          cd tests
          c="$MARLIN_COMPILER"
          for emit in mlir llvm-mlir llvm-ir obj exe; do
            echo "=== --emit=$emit"
            "$c" print.marl --emit=$emit -o "out.$emit" > log.txt 2>&1
            echo "cikis kodu: $?"
            head -40 log.txt
          done
          ls -la out.* || true
          [ -f out.exe ] && { ./out.exe; echo "program cikis kodu: $?"; } || true
